<g text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><text x="600" y="61" fill="#7DD3FC" font-size="14" letter-spacing="5">IDEAS → INTERFACES → PRODUCTS</text><text x="600" y="155" fill="url(#g)" font-size="78" font-weight="800">hey, I'm Anuz.</text><text x="600" y="213" fill="#D6D9F0" font-size="25">I build for the web, your phone, and your Mac.</text><text x="600" y="264" fill="#9CA6C8" font-family="monospace" font-size="17">TypeScript · Swift · Kotlin · a lot of curiosity</text></g>
